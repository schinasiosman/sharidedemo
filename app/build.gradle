plugins {
    id 'com.android.application'
}

android {
    namespace 'mk.sharide.demo'
    compileSdk 34

    defaultConfig {
        applicationId 'mk.sharide.demo'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1-demo'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
